services:
  - type: web
    name: zyraviq-ai-logistics
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: AI_SERVICE_HOSTPORT
        fromService:
          type: web
          name: zyraviq-ai-service
          property: hostport
      - key: CORS_ORIGIN
        value: https://zyraviq-ai.onrender.com
      - key: SOCKET_CORS_ORIGIN
        value: https://zyraviq-ai.onrender.com
      - key: PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
      - key: SMS_PROVIDER
        value: webhook
      - key: SMS_WEBHOOK_URL
        sync: false
      - key: SMS_WEBHOOK_TOKEN
        sync: false
      - key: SMS_STRICT_DELIVERY
        value: false
      - key: LOGIN_OTP_TTL_MINUTES
        value: 5
      - key: LOGIN_OTP_RESEND_SECONDS
        value: 45

  - type: web
    name: zyraviq-ai
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci
    startCommand: cd frontend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        value: https://zyraviq-ai-logistics.onrender.com
      - key: PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false

  - type: web
    name: zyraviq-ai-service
    runtime: python
    plan: free
    buildCommand: cd ai-service && pip install -r requirements.txt
    startCommand: cd ai-service && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
